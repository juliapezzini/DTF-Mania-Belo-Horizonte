<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DTF Mania</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --preto-topo: #0e0808;
            --cinza-bg: #C4C4C4;
            --cinza-escuro: #333333; 
            --white: #ffffff;
        }

        /* REMOVE O AZUL AO CLICAR EM QUALQUER LUGAR (MOBILE) */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body { 
            background-color: var(--cinza-bg); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            -webkit-text-size-adjust: 100%;
        }

        header { background: var(--preto-topo); padding: 0 5%; display: flex; justify-content: space-between; align-items: center; height: 80px; position: sticky; top: 0; z-index: 2000; }
        .logo img { height: 45px; }
        .header-icons { display: flex; gap: 20px; color: white; font-size: 22px; }
        .header-icons i { cursor: pointer; position: relative; }
        .badge { position: absolute; top: -8px; right: -12px; background: var(--cinza-escuro); color: white; font-size: 11px; padding: 2px 7px; border-radius: 50%; font-weight: 900; }
        
        .hero { width: 100%; padding: 20px 5% 0 5%; }
        .hero-banner { width: 100%; aspect-ratio: 2000 / 850; border-radius: 25px; overflow: hidden; position: relative; background: #000; }
        .hero-banner img { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0; transition: opacity 1s; }
        .hero-banner img.active { opacity: 1; }

        .home-notice {
            background: #fff;
            margin: 20px 5%;
            padding: 20px;
            border-radius: 15px;
            border-left: 6px solid var(--preto-topo);
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .home-notice b { color: #d32f2f; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 0 5%; margin-bottom: 40px; }
        .product-card { background: #E0E0E0; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; transition: transform 0.1s; }
        .product-card:active { transform: scale(0.97); }

        .img-holder { width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; margin-bottom: 12px; background: white; }
        .img-holder img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn-main { 
            background: var(--cinza-escuro); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: auto; 
            font-size: 12px; 
            transition: opacity 0.1s;
        }
        .btn-main:active { opacity: 0.7; transform: scale(0.98); }

        /* Painéis e Overlays */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; }
        .side-panel { position: fixed; top: 0; right: -100%; width: 450px; height: 100%; background: #fff; z-index: 3001; transition: 0.4s ease; display: flex; flex-direction: column; }
        .side-panel.active { right: 0; }
        .panel-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .panel-body { flex: 1; overflow-y: auto; padding: 15px; } /* Reduzi um pouco o padding lateral */
        .panel-footer { padding: 20px; border-top: 1px solid #eee; }

        .list-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
        .list-item img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; }
        .valor-integral-destaque { font-size: 26px; font-weight: 900; color: #000; display: block; }

        .qty-box { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 20px 0; }
        .qty-btn { background: var(--cinza-escuro); color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; }
        .qty-btn:active { transform: scale(0.9); }
        
        #prodQty { width: 50px; text-align: center; border: none; font-size: 24px; font-weight: 900; background: transparent; }
        
        /* AUMENTO DA IMAGEM DO MODAL */
        .detail-img-huge { 
            width: 100%; 
            height: auto; 
            max-height: 450px; /* Aumentado de 320px para 450px */
            object-fit: contain; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            background: #f9f9f9; 
            display: block;
        }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-card { background: #f4f4f4; border-radius: 15px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #333; text-decoration: none; transition: background 0.2s; }
        .menu-card:active { background: #e0e0e0; }
        .menu-card i { font-size: 24px; margin-bottom: 8px; }

        @media (max-width: 768px) { 
            .side-panel { width: 100%; } 
            .product-grid { grid-template-columns: 1fr 1fr; } 
            .detail-img-huge { max-height: 400px; } /* Ajuste fino para telas menores */
        }
        
        footer { background: var(--preto-topo); color: white; padding: 60px 5% 40px; text-align: center; margin-top: 50px; }
        .footer-logo { height: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<header>
    <div style="display:flex; align-items:center; gap:20px;">
        <i class="fas fa-bars" onclick="openPanel('menu')" style="color:white; font-size:24px; cursor:pointer;"></i>
        <div class="logo"><img src="logo.png" alt="DTF Mania"></div>
    </div>
    <div class="header-icons">
        <i class="far fa-heart" onclick="openPanel('favs')"><span class="badge" id="favCount">0</span></i>
        <i class="fas fa-shopping-bag" onclick="openPanel('cart')"><span class="badge" id="cartCount">0</span></i>
    </div>
</header>

<main>
    <section class="hero">
        <div class="hero-banner" id="banner">
            <img src="banner1.png" class="active">
            <img src="banner2.png">
        </div>
    </section>

    <div class="home-notice">
        <b>IMPORTANTE:</b> Pedidos finalizados via <b>WhatsApp</b>.<br>
        • RETIRADA: Av. Amazonas, 1502, Loja 02 - Barro Preto, BH.
    </div>

    <div class="product-grid" id="productGrid"></div> 
</main>

<div class="side-panel" id="sidePanel">
    <div class="panel-header">
        <h2 id="panelTitle" style="font-family:'Archivo Black'; font-size:14px; text-transform:uppercase;"></h2>
        <i class="fas fa-times" onclick="closeAll()" style="cursor:pointer; font-size:22px;"></i>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-footer" id="panelFooter"></div>
</div>

<footer>
    <img src="logo.png" alt="DTF Mania" class="footer-logo">
    <p style="font-size: 11px; opacity: 0.6; letter-spacing: 2px; font-weight: 800;">DTF MANIA © 2026</p>
</footer>

<script>
    const PRODUTOS = [
        { nome: "Notificação Favorita", preco: 29.99, img: "c (2).jpg" },
        { nome: "Oi Amor", preco: 29.99, img: "c (3).jpg" },
        { nome: "Te Amo Mãe", preco: 29.99, img: "c (16).jpg" },
        { nome: "Além da Vida", preco: 29.99, img: "c (29).jpg" },
        { nome: "Melhor Mãe do Mundo", preco: 29.99, img: "c (5).jpg" },
        { nome: "Dia das Mulheres", preco: 29.99, img: "c (45).jpg" },
        { nome: "Promovida a Dinda", preco: 29.99, img: "c (51).jpg" },
        { nome: "Amigas, Irmãs, Parceiras", preco: 29.99, img: "c (42).jpg" },
        { nome: "Levante e seja feliz", preco: 29.99, img: "c (6).jpg" },
        { nome: "Você é mais forte", preco: 29.99, img: "c (7).jpg" },
        { nome: "Caneca da Prof", preco: 29.99, img: "c (19).jpg" },
        { nome: "Você Faz Meu Coração Feliz", preco: 29.99, img: "c (8).jpg" },
        { nome: "Caneca do Prof", preco: 29.99, img: "c (22).jpg" },
        { nome: "Lágrimas dos Alunos", preco: 29.99, img: "c (25).jpg" },
        { nome: "Melhor Professora", preco: 29.99, img: "c (26).jpg" },
        { nome: "Melhor Professor", preco: 29.99, img: "c (28).jpg" },
        { nome: "Feliz Dia dos Pais", preco: 29.99, img: "c (23).jpg" },
        { nome: "Querido Pai", preco: 29.99, img: "c (27).jpg" },
        { nome: "Borboletas", preco: 29.99, img: "c (52).jpg" },
        { nome: "Maria Bonita", preco: 29.99, img: "c (40).jpg" },
        { nome: "Promovido a Vovô", preco: 29.99, img: "c (21).jpg" },
        { nome: "Simba", preco: 29.99, img: "c (13).jpg" },
        { nome: "Panda", preco: 29.99, img: "c (14).jpg" },
        { nome: "Dia dos Avôs", preco: 29.99, img: "c (18).jpg" },
        { nome: "Promovida a Vovó", preco: 29.99, img: "c (24).jpg" },
        { nome: "Gratidão", preco: 29.99, img: "c (38).jpg" },
        { nome: "Amor é uma Escolha", preco: 29.99, img: "c (46).jpg" },
        { nome: "Frase de Mãe", preco: 29.99, img: "c (49).jpg" },
        { nome: "Mulherão", preco: 29.99, img: "c (41).jpg" },
        { nome: "Girafa", preco: 29.99, img: "c (10).jpg" },
        { nome: "Super Mario", preco: 29.99, img: "c (11).jpg" },
        { nome: "Marvel", preco: 29.99, img: "c (12).jpg" },
        { nome: "Pai Significado", preco: 29.99, img: "c (30).jpg" },
        { nome: "Harry Potter", preco: 29.99, img: "c (31).jpg" },
        { nome: "Eu Amo Leitura", preco: 29.99, img: "c (32).jpg" },
        { nome: "Não Nos Falte Fé", preco: 29.99, img: "c (33).jpg" },
        { nome: "Star Wars", preco: 29.99, img: "c (34).jpg" },
        { nome: "Stranger Things", preco: 29.99, img: "c (35).jpg" },
        { nome: "Sapo Cururu", preco: 29.99, img: "c (36).jpg" },
        { nome: "Plantei Uma Amiga", preco: 29.99, img: "c (43).jpg" },
        { nome: "Yeshua", preco: 29.99, img: "c (44).jpg" },
        { nome: "Te Amo Vida", preco: 29.99, img: "c (47).jpg" }
    ];

    let cart = JSON.parse(localStorage.getItem('dtf_cart')) || [];
    let favs = JSON.parse(localStorage.getItem('dtf_favs')) || [];

    function save() {
        localStorage.setItem('dtf_cart', JSON.stringify(cart));
        localStorage.setItem('dtf_favs', JSON.stringify(favs));
        updateBadges();
    }

    function renderProducts() {
        document.getElementById('productGrid').innerHTML = PRODUTOS.map(p => `
            <div class="product-card">
                <div class="img-holder"><img src="${p.img}"></div>
                <p style="font-weight:700; font-size:12px; margin-bottom:4px;">${p.nome}</p>
                <p style="font-weight:800; font-size:15px; margin-bottom:10px;">R$ ${p.preco.toFixed(2)}</p>
                <button class="btn-main" onclick="openDetails('${p.nome}', ${p.preco}, '${p.img}')">VER DETALHES</button>
            </div>
        `).join('');
    }

    function openPanel(type) {
        const body = document.getElementById('panelBody');
        const footer = document.getElementById('panelFooter');
        footer.style.display = 'none';
        
        if(type === 'menu') {
            document.getElementById('panelTitle').innerText = "Menu";
            body.innerHTML = `<div class="menu-grid">
                <div class="menu-card" onclick="closeAll()"><i class="fas fa-home"></i><span>Loja</span></div>
                <div class="menu-card" onclick="openPanel('cart')"><i class="fas fa-shopping-bag"></i><span>Sacola</span></div>
                <div class="menu-card" onclick="openPanel('favs')"><i class="fas fa-heart"></i><span>Desejos</span></div>
                <a href="https://wa.me/5531981032274" class="menu-card" style="text-decoration:none;"><i class="fab fa-whatsapp"></i><span>Suporte</span></a>
            </div>`;
        } else if(type === 'cart') {
            document.getElementById('panelTitle').innerText = "Minha Sacola";
            let total = cart.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
            let sinal = total * 0.5;

            body.innerHTML = cart.length === 0 ? "Sua sacola está vazia." : cart.map((item, i) => `
                <div class="list-item">
                    <img src="${item.img}">
                    <div style="flex:1"><b>${item.nome}</b><br><small>${item.qtd}x R$ ${item.preco.toFixed(2)}</small></div>
                    <i class="fas fa-trash-alt" style="color:#ddd; cursor:pointer;" onclick="removeItem('cart', ${i})"></i>
                </div>
            `).join('') + (cart.length > 0 ? `
                <div style="background:#f9f9f9; padding:20px; border-radius:12px; margin-top:10px;">
                    <span style="font-size:11px; color:#666; font-weight:800; text-transform:uppercase;">Valor Integral:</span>
                    <span class="valor-integral-destaque">R$ ${total.toFixed(2)}</span>
                    <hr style="margin:12px 0; border:0; border-top:1px solid #eee;">
                    <span style="font-size:11px; color:#666; font-weight:800; text-transform:uppercase;">Sinal para Produção (50%):</span>
                    <span style="display:block; font-size:20px; font-weight:800; color:#27ae60;">R$ ${sinal.toFixed(2)}</span>
                </div>` : '');
            if(cart.length > 0) {
                footer.style.display = 'block';
                footer.innerHTML = `<button class="btn-main" style="padding:16px; font-size:14px;" onclick="checkout()">FINALIZAR NO WHATSAPP</button>`;
            }
        } else if(type === 'favs') {
            document.getElementById('panelTitle').innerText = "Meus Favoritos";
            body.innerHTML = favs.length === 0 ? "Nenhum item salvo." : favs.map((item, i) => `
                <div class="list-item">
                    <img src="${item.img}">
                    <div style="flex:1"><b>${item.nome}</b><br>R$ ${item.preco.toFixed(2)}</div>
                    <i class="fas fa-trash-alt" style="color:#ddd; cursor:pointer;" onclick="removeItem('favs', ${i})"></i>
                </div>
            `).join('');
            if(favs.length > 0) {
                footer.style.display = 'block';
                footer.innerHTML = `<button class="btn-main" onclick="moveAllToCart()">MOVER TUDO PARA A SACOLA</button>`;
            }
        }
        document.getElementById('sidePanel').classList.add('active');
        document.getElementById('overlay').style.display = 'block';
    }

    function openDetails(nome, preco, img) {
        const body = document.getElementById('panelBody');
        const footer = document.getElementById('panelFooter');
        document.getElementById('panelTitle').innerText = "Detalhes";
        body.innerHTML = `
            <img src="${img}" class="detail-img-huge">
            <h3 style="text-align:center;">${nome}</h3>
            <p style="text-align:center; font-size:32px; font-weight:900; margin:10px 0;">R$ ${preco.toFixed(2)}</p>
            <div class="qty-box">
                <button class="qty-btn" onclick="updateQty(-1)">-</button>
                <input type="number" id="prodQty" value="1" readonly>
                <button class="qty-btn" onclick="updateQty(1)">+</button>
            </div>`;
        footer.style.display = 'block';
        footer.innerHTML = `
            <button class="btn-main" style="padding:15px; margin-bottom:10px" onclick="addToCart('${nome}', ${preco}, '${img}')">ADICIONAR AO CARRINHO</button>
            <button class="btn-main" style="padding:15px;" onclick="addToFavs('${nome}', ${preco}, '${img}')">SALVAR NOS FAVORITOS</button>
        `;
        document.getElementById('sidePanel').classList.add('active');
        document.getElementById('overlay').style.display = 'block';
    }

    function updateQty(val) {
        let input = document.getElementById('prodQty');
        let n = parseInt(input.value) + val;
        if(n > 0) input.value = n;
    }

    function addToCart(nome, preco, img) {
        let qtd = parseInt(document.getElementById('prodQty').value);
        cart.push({nome, preco, img, qtd});
        save();
        openPanel('cart');
    }

    function addToFavs(nome, preco, img) {
        if(!favs.find(f => f.nome === nome)) {
            favs.push({nome, preco, img});
            save();
        }
        openPanel('favs');
    }

    function moveAllToCart() {
        favs.forEach(f => cart.push({...f, qtd: 1}));
        favs = [];
        save();
        openPanel('cart');
    }

    function removeItem(type, index) {
        if(type === 'cart') cart.splice(index, 1);
        else favs.splice(index, 1);
        save();
        openPanel(type);
    }

    function updateBadges() {
        document.getElementById('cartCount').innerText = cart.length;
        document.getElementById('favCount').innerText = favs.length;
    }

    function closeAll() {
        document.getElementById('sidePanel').classList.remove('active');
        document.getElementById('overlay').style.display = 'none';
    }

    function checkout() {
        let total = cart.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
        let sinal = total * 0.5;
        let msg = `PEDIDO DTF MANIA\n\n` + 
                  cart.map(i => i.qtd + "x " + i.nome).join('\n') + 
                  `\n\nVALOR INTEGRAL: R$ ` + total.toFixed(2) +
                  `\nSINAL (50%): R$ ` + sinal.toFixed(2);
        window.open(`https://wa.me/5531981032274?text=${encodeURIComponent(msg)}`);
    }

    // Controle do Banner
    const imgs = document.querySelectorAll('#banner img');
    let cur = 0;
    setInterval(() => {
        if(imgs.length > 0) {
            imgs[cur].classList.remove('active');
            cur = (cur + 1) % imgs.length;
            imgs[cur].classList.add('active');
        }
    }, 4000);

    renderProducts();
    updateBadges();
</script>
</body>
</html>
